[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dbgate-dashboard-mcp"
version = "0.1.0"
description = "MCP server for querying databases through a running DbGate dashboard."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Evgenii Danilin", email = "evgenii.danilin.m@gmail.com" }]
keywords = ["mcp", "dbgate", "database", "sql", "postgres", "mysql", "sqlite"]
dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.27",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5"]

[project.scripts]
dbgate-dashboard-mcp = "dbgate_dashboard_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dbgate_dashboard_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov --cov-branch --cov-report=term-missing --cov-fail-under=100"

[tool.coverage.run]
source = ["dbgate_dashboard_mcp"]
omit = ["*/__main__.py"]  # entry shim: only runs under `python -m`, no logic

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    'if __name__ == .__main__.:',
]
